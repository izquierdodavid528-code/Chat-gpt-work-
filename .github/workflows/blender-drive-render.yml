name: Blender Drive Render

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Blender project slug under projects/"
        required: true
        type: string
      repo_project_dir:
        description: "Optional repo path. Default: projects/<project_slug>"
        required: false
        default: ""
        type: string
      drive_project_dir:
        description: "Optional Drive folder. Leave blank to use project.config.json or slug"
        required: false
        default: ""
        type: string

jobs:
  render:
    runs-on: ubuntu-24.04
    env:
      DRIVE_BASE: "Remotion Projects"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve project
        shell: bash
        run: |
          SLUG="${{ inputs.project_slug }}"
          REPO_DIR="${{ inputs.repo_project_dir }}"
          DRIVE_DIR="${{ inputs.drive_project_dir }}"

          if [ -z "$REPO_DIR" ]; then
            REPO_DIR="projects/$SLUG"
          fi

          CONFIG="$REPO_DIR/project.config.json"
          test -f "$CONFIG"

          if [ -z "$DRIVE_DIR" ]; then
            DRIVE_DIR="$(node -e 'const c=require(process.argv[1]); console.log(c.driveProjectDir || "")' "$CONFIG")"
          fi
          if [ -z "$DRIVE_DIR" ]; then
            DRIVE_DIR="$SLUG"
          fi

          echo "PROJECT_SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$REPO_DIR" >> "$GITHUB_ENV"
          echo "DRIVE_PROJECT=$DRIVE_DIR" >> "$GITHUB_ENV"

      - name: Restore rclone config
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        shell: bash
        run: |
          test -n "$RCLONE_CONFIG_B64"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"

      - name: Install pinned rclone
        shell: bash
        run: |
          RCLONE_VERSION="1.75.1"
          ARCHIVE="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_VERSION}/${ARCHIVE}"
          unzip -q "$ARCHIVE"
          sudo install -m 0755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Install Blender
        shell: bash
        run: bash scripts/blender/install.sh

      - name: Pull project assets
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/assets"
          if rclone --config "$RUNNER_TEMP/rclone.conf" lsf "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets" >/dev/null 2>&1; then
            rclone --config "$RUNNER_TEMP/rclone.conf" copy               "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets"               "$PROJECT_DIR/assets"               --create-empty-src-dirs --transfers 8 --checkers 16
          fi

      - name: Render Blender project
        shell: bash
        run: bash scripts/workspace/render-blender.sh "$PROJECT_SLUG"

      - name: Record environment
        shell: bash
        run: |
          {
            echo "runner=ubuntu-24.04"
            blender --version | head -n 3
            echo "rclone=$(rclone version | head -n 1)"
          } > "$PROJECT_DIR/out/render-environment.txt"

      - name: Upload render to Drive
        shell: bash
        run: |
          rclone --config "$RUNNER_TEMP/rclone.conf" mkdir "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders"
          rclone --config "$RUNNER_TEMP/rclone.conf" copy             "$PROJECT_DIR/out"             "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders"             --transfers 4 --checkers 8

      - name: Upload artifact backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blender-${{ env.PROJECT_SLUG }}-${{ github.run_id }}
          path: ${{ env.PROJECT_DIR }}/out/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup credential
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone.conf"
