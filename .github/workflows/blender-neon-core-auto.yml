name: Blender Neon Core Auto Render

on:
  push:
    paths:
      - "projects/blender-neon-core-demo/**"
      - ".github/workflows/blender-neon-core-auto.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    env:
      PROJECT_SLUG: "blender-neon-core-demo"
      PROJECT_DIR: "projects/blender-neon-core-demo"
      DRIVE_BASE: "Remotion Projects"
      DRIVE_PROJECT: "03 - Blender Neon Core Demo"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Restore rclone config
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        shell: bash
        run: |
          test -n "$RCLONE_CONFIG_B64"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"

      - name: Install pinned rclone
        shell: bash
        run: |
          RCLONE_VERSION="1.75.1"
          ARCHIVE="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_VERSION}/${ARCHIVE}"
          unzip -q "$ARCHIVE"
          sudo install -m 0755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Install Blender
        shell: bash
        run: bash scripts/blender/install.sh

      - name: Pull optional assets
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/assets"
          if rclone --config "$RUNNER_TEMP/rclone.conf" lsf "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets" >/dev/null 2>&1; then
            rclone --config "$RUNNER_TEMP/rclone.conf" copy               "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets"               "$PROJECT_DIR/assets"               --create-empty-src-dirs --transfers 8 --checkers 16
          fi

      - name: Render Blender scene
        shell: bash
        run: bash scripts/workspace/render-blender.sh "$PROJECT_SLUG"

      - name: Record environment
        shell: bash
        run: |
          {
            echo "runner=ubuntu-24.04"
            blender --version | head -n 3
            echo "rclone=$(rclone version | head -n 1)"
            echo "renderer=EEVEE software"
            echo "resolution=720x1280"
            echo "fps=24"
            echo "frames=120"
          } > "$PROJECT_DIR/out/render-environment.txt"

      - name: Upload to Drive
        shell: bash
        run: |
          rclone --config "$RUNNER_TEMP/rclone.conf" mkdir "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders"
          rclone --config "$RUNNER_TEMP/rclone.conf" copy             "$PROJECT_DIR/out"             "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders"             --transfers 4 --checkers 8 --stats 10s

      - name: Upload artifact backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blender-neon-core-${{ github.run_id }}
          path: ${{ env.PROJECT_DIR }}/out/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone.conf"
