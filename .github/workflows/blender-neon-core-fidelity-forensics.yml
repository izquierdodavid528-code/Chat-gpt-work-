name: Blender Neon Core Fidelity Forensics

on:
  push:
    paths:
      - ".github/workflows/blender-neon-core-fidelity-forensics.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: "37033676294"

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - name: Download master artifact from verified run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: neon-core-master-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/master
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download rendered frame artifacts from verified run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: neon-core-frames-*-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/frames
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Install comparison tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg imagemagick >/dev/null

      - name: Quantify control-frame differences
        shell: bash
        run: |
          mkdir -p out
          REPORT=out/fidelity-forensics.txt
          : > "$REPORT"

          for FRAME in 1 60 120; do
            NAME="$(printf '%04d.png' "$FRAME")"
            REF="$RUNNER_TEMP/master/reference/$NAME"
            ACTUAL="$RUNNER_TEMP/frames/$NAME"

            echo "=== FRAME $FRAME ===" | tee -a "$REPORT"
            sha256sum "$REF" "$ACTUAL" | tee -a "$REPORT"

            echo "-- RMSE (ImageMagick) --" | tee -a "$REPORT"
            compare -metric RMSE "$REF" "$ACTUAL" null: 2>> "$REPORT" || true
            echo >> "$REPORT"

            echo "-- Absolute error pixels (exact) --" | tee -a "$REPORT"
            compare -metric AE "$REF" "$ACTUAL" null: 2>> "$REPORT" || true
            echo >> "$REPORT"

            echo "-- PSNR --" | tee -a "$REPORT"
            ffmpeg -v info -i "$REF" -i "$ACTUAL" -lavfi psnr -f null - 2>&1               | grep -E 'PSNR|average:' | tail -n 2 | tee -a "$REPORT" || true

            echo "-- SSIM --" | tee -a "$REPORT"
            ffmpeg -v info -i "$REF" -i "$ACTUAL" -lavfi ssim -f null - 2>&1               | grep -E 'SSIM|All:' | tail -n 2 | tee -a "$REPORT" || true

            echo >> "$REPORT"
          done

          cat "$REPORT"

      - name: Upload forensic report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-core-fidelity-forensics-${{ github.run_id }}
          path: out/fidelity-forensics.txt
          retention-days: 14
          if-no-files-found: error
