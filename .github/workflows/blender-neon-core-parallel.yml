name: Blender Neon Core Parallel Render

on:
  push:
    paths:
      - ".github/workflows/blender-neon-core-parallel.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_SLUG: blender-neon-core-demo
  PROJECT_DIR: projects/blender-neon-core-demo
  DRIVE_BASE: Remotion Projects
  DRIVE_PROJECT: 03 - Blender Neon Core Demo

jobs:
  build-scene:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        shell: bash
        run: bash scripts/blender/install.sh

      - name: Build blend without rendering
        shell: bash
        env:
          BLENDER_BUILD_ONLY: "1"
          BLENDER_SKIP_POSTER: "1"
        run: |
          mkdir -p "$PROJECT_DIR/out"
          blender -b --python "$PROJECT_DIR/scene.py"
          test -s "$PROJECT_DIR/out/neon-core-demo.blend"

      - name: Upload blend artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-core-blend
          path: ${{ env.PROJECT_DIR }}/out/neon-core-demo.blend
          retention-days: 1
          if-no-files-found: error

  render-blocks:
    needs: build-scene
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { block: "01", start: 1, end: 12 }
          - { block: "02", start: 13, end: 24 }
          - { block: "03", start: 25, end: 36 }
          - { block: "04", start: 37, end: 48 }
          - { block: "05", start: 49, end: 60 }
          - { block: "06", start: 61, end: 72 }
          - { block: "07", start: 73, end: 84 }
          - { block: "08", start: 85, end: 96 }
          - { block: "09", start: 97, end: 108 }
          - { block: "10", start: 109, end: 120 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        shell: bash
        run: bash scripts/blender/install.sh

      - name: Download blend artifact
        uses: actions/download-artifact@v4
        with:
          name: neon-core-blend
          path: ${{ env.PROJECT_DIR }}/out

      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frames"
          START_TS=$(date +%s)
          blender -b "$PROJECT_DIR/out/neon-core-demo.blend" \
            -s "${{ matrix.start }}" \
            -e "${{ matrix.end }}" \
            -o "$RUNNER_TEMP/frames/####" \
            -F PNG \
            -a
          END_TS=$(date +%s)
          echo "block=${{ matrix.block }}" > "$RUNNER_TEMP/frames/block-${{ matrix.block }}.txt"
          echo "start=${{ matrix.start }}" >> "$RUNNER_TEMP/frames/block-${{ matrix.block }}.txt"
          echo "end=${{ matrix.end }}" >> "$RUNNER_TEMP/frames/block-${{ matrix.block }}.txt"
          echo "elapsed_seconds=$((END_TS-START_TS))" >> "$RUNNER_TEMP/frames/block-${{ matrix.block }}.txt"
          test "$(find "$RUNNER_TEMP/frames" -maxdepth 1 -name '*.png' | wc -l)" -eq "$(( ${{ matrix.end }} - ${{ matrix.start }} + 1 ))"

      - name: Upload block
        uses: actions/upload-artifact@v4
        with:
          name: neon-core-frames-${{ matrix.block }}
          path: |
            ${{ runner.temp }}/frames/*.png
            ${{ runner.temp }}/frames/block-${{ matrix.block }}.txt
          retention-days: 1
          if-no-files-found: error

  assemble:
    needs: render-blocks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all frame blocks
        uses: actions/download-artifact@v4
        with:
          pattern: neon-core-frames-*
          path: ${{ runner.temp }}/all-frames
          merge-multiple: true

      - name: Verify all 120 frames
        shell: bash
        run: |
          COUNT=$(find "$RUNNER_TEMP/all-frames" -maxdepth 1 -name '*.png' | wc -l)
          echo "PNG frames: $COUNT"
          test "$COUNT" -eq 120
          for N in $(seq -w 1 120); do
            test -s "$RUNNER_TEMP/all-frames/$N.png"
          done

      - name: Assemble MP4
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          mkdir -p out
          ffmpeg -y \
            -framerate 24 \
            -start_number 1 \
            -i "$RUNNER_TEMP/all-frames/%04d.png" \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -pix_fmt yuv420p \
            out/neon-core-demo-parallel.mp4
          test -s out/neon-core-demo-parallel.mp4

      - name: Build timing report
        shell: bash
        run: |
          {
            echo "Parallel Blender render"
            echo "Project: $PROJECT_SLUG"
            echo "Frames: 1-120"
            echo "Blocks: 10 x 12 frames"
            echo
            cat "$RUNNER_TEMP"/all-frames/block-*.txt
          } > out/parallel-render-report.txt

      - name: Restore rclone config
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          test -n "$RCLONE_CONFIG_B64"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"

      - name: Install pinned rclone
        shell: bash
        run: |
          curl -fsSLO "https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip"
          unzip -q rclone-v1.75.1-linux-amd64.zip
          sudo install -m 0755 rclone-v1.75.1-linux-amd64/rclone /usr/local/bin/rclone

      - name: Upload final render to Drive
        shell: bash
        run: |
          rclone --config "$RUNNER_TEMP/rclone.conf" copy \
            out \
            "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders" \
            --include "neon-core-demo-parallel.mp4" \
            --include "parallel-render-report.txt"

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-core-parallel-final
          path: out/
          retention-days: 1
          if-no-files-found: error
