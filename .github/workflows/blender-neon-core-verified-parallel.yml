name: Blender Neon Core Verified Parallel

on:
  push:
    paths:
      - ".github/workflows/blender-neon-core-verified-parallel.yml"
      - "scripts/blender/install-pinned.sh"
      - "scripts/blender/master-audit.py"
      - "scripts/blender/parallel-plan.py"
      - "projects/blender-neon-core-demo/project.config.json"
      - "projects/blender-neon-core-demo/scene.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_SLUG: blender-neon-core-demo
  PROJECT_DIR: projects/blender-neon-core-demo
  DRIVE_BASE: Remotion Projects
  DRIVE_PROJECT: 03 - Blender Neon Core Demo
  BLENDER_VERSION: "4.5.14"

jobs:
  build-master:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      control_frames: ${{ steps.plan.outputs.control_frames }}
      fps: ${{ steps.plan.outputs.fps }}
      video_codec: ${{ steps.plan.outputs.video_codec }}
      video_preset: ${{ steps.plan.outputs.video_preset }}
      video_crf: ${{ steps.plan.outputs.video_crf }}
      video_pix_fmt: ${{ steps.plan.outputs.video_pix_fmt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve parallel plan
        id: plan
        shell: bash
        run: |
          python3 scripts/blender/parallel-plan.py "$PROJECT_DIR" "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Restore rclone config
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          test -n "$RCLONE_CONFIG_B64"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"

      - name: Install pinned rclone
        shell: bash
        run: |
          RCLONE_VERSION="1.75.1"
          ARCHIVE="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_VERSION}/${ARCHIVE}"
          unzip -q "$ARCHIVE"
          sudo install -m 0755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Pull project assets
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/assets"
          if rclone --config "$RUNNER_TEMP/rclone.conf" lsf "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets" >/dev/null 2>&1; then
            rclone --config "$RUNNER_TEMP/rclone.conf" copy               "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets"               "$PROJECT_DIR/assets"               --create-empty-src-dirs --transfers 8 --checkers 16
          fi

      - name: Install exact Blender
        shell: bash
        run: bash scripts/blender/install-pinned.sh "$BLENDER_VERSION"

      - name: Build master scene only
        shell: bash
        env:
          BLENDER_BUILD_ONLY: "1"
          BLENDER_SKIP_POSTER: "1"
        run: |
          rm -rf "$PROJECT_DIR/out"
          mkdir -p "$PROJECT_DIR/out"
          blender -b --python "$PROJECT_DIR/scene.py"
          test -s "$PROJECT_DIR/out/neon-core-demo.blend"

      - name: Audit and fingerprint master scene
        shell: bash
        env:
          BLENDER_SIMULATION_POLICY: "none"
          BLENDER_PACK_RESOURCES: "1"
        run: |
          blender -b "$PROJECT_DIR/out/neon-core-demo.blend"             --python scripts/blender/master-audit.py             -- "$PROJECT_DIR/out/master-manifest.json"
          test -s "$PROJECT_DIR/out/master-manifest.json"
          sha256sum "$PROJECT_DIR/out/neon-core-demo.blend" | tee "$PROJECT_DIR/out/master-blend.sha256"

      - name: Render reference control frames
        shell: bash
        env:
          CONTROL_FRAMES: ${{ steps.plan.outputs.control_frames }}
        run: |
          mkdir -p "$PROJECT_DIR/out/reference"
          for FRAME in $CONTROL_FRAMES; do
            blender -b "$PROJECT_DIR/out/neon-core-demo.blend"               -o "$PROJECT_DIR/out/reference/####"               -F PNG               -f "$FRAME"
          done
          find "$PROJECT_DIR/out/reference" -maxdepth 1 -type f -name '*.png' -print

      - name: Record master environment
        shell: bash
        run: |
          {
            echo "runner=ubuntu-24.04"
            echo "workflow=verified-parallel-v1"
            blender --version | head -n 3
            echo "rclone=$(rclone version | head -n 1)"
            uname -a
          } > "$PROJECT_DIR/out/render-environment.txt"

      - name: Upload immutable master bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-core-master-${{ github.run_id }}
          path: |
            ${{ env.PROJECT_DIR }}/out/neon-core-demo.blend
            ${{ env.PROJECT_DIR }}/out/master-manifest.json
            ${{ env.PROJECT_DIR }}/out/master-blend.sha256
            ${{ env.PROJECT_DIR }}/out/render-environment.txt
            ${{ env.PROJECT_DIR }}/out/reference/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup credential
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone.conf"

  render-blocks:
    needs: build-master
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.build-master.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Blender
        shell: bash
        run: bash scripts/blender/install-pinned.sh "$BLENDER_VERSION"

      - name: Download immutable master
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: neon-core-master-${{ github.run_id }}
          path: "$RUNNER_TEMP/master"

      - name: Verify master fingerprint
        shell: bash
        run: |
          EXPECTED="$(cut -d' ' -f1 "$RUNNER_TEMP/master/master-blend.sha256")"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/master/neon-core-demo.blend" | cut -d' ' -f1)"
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Render block ${{ matrix.block }} frames ${{ matrix.start }}-${{ matrix.end }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frames"
          START_TS=$(date +%s)
          blender -b "$RUNNER_TEMP/master/neon-core-demo.blend"             -s "${{ matrix.start }}"             -e "${{ matrix.end }}"             -o "$RUNNER_TEMP/frames/####"             -F PNG             -a
          END_TS=$(date +%s)

          EXPECTED_COUNT=$(( ${{ matrix.end }} - ${{ matrix.start }} + 1 ))
          ACTUAL_COUNT="$(find "$RUNNER_TEMP/frames" -maxdepth 1 -name '*.png' | wc -l)"
          test "$ACTUAL_COUNT" -eq "$EXPECTED_COUNT"

          {
            echo "block=${{ matrix.block }}"
            echo "start=${{ matrix.start }}"
            echo "end=${{ matrix.end }}"
            echo "elapsed_seconds=$((END_TS-START_TS))"
            echo "runner=${{ runner.name }}"
            echo "master_sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/master/master-blend.sha256")"
          } > "$RUNNER_TEMP/frames/block-${{ matrix.block }}.txt"

      - name: Upload block artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-core-frames-${{ matrix.block }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/frames/*.png
            ${{ runner.temp }}/frames/block-${{ matrix.block }}.txt
          if-no-files-found: error
          retention-days: 14

  verify-assemble-deliver:
    needs: [build-master, render-blocks]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download immutable master
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: neon-core-master-${{ github.run_id }}
          path: "$RUNNER_TEMP/master"

      - name: Download all frame blocks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: neon-core-frames-*-${{ github.run_id }}
          path: "$RUNNER_TEMP/frames"
          merge-multiple: true

      - name: Install verification and encoding tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null

      - name: Verify frame completeness
        shell: bash
        run: |
          COUNT="$(find "$RUNNER_TEMP/frames" -maxdepth 1 -name '*.png' | wc -l)"
          echo "frame_count=$COUNT"
          test "$COUNT" -eq 120
          for FRAME in $(seq 1 120); do
            NAME="$(printf '%04d.png' "$FRAME")"
            test -s "$RUNNER_TEMP/frames/$NAME"
          done

      - name: Verify control frames pixel-for-pixel
        shell: bash
        env:
          CONTROL_FRAMES: ${{ needs.build-master.outputs.control_frames }}
        run: |
          REPORT="$RUNNER_TEMP/fidelity-report.txt"
          : > "$REPORT"

          for FRAME in $CONTROL_FRAMES; do
            NAME="$(printf '%04d.png' "$FRAME")"
            REF="$RUNNER_TEMP/master/reference/$NAME"
            ACTUAL="$RUNNER_TEMP/frames/$NAME"
            test -s "$REF"
            test -s "$ACTUAL"

            REF_HASH="$(ffmpeg -v error -i "$REF" -f framemd5 - | tail -n 1 | awk -F', ' '{print $NF}')"
            ACTUAL_HASH="$(ffmpeg -v error -i "$ACTUAL" -f framemd5 - | tail -n 1 | awk -F', ' '{print $NF}')"

            echo "frame=$FRAME reference=$REF_HASH parallel=$ACTUAL_HASH" | tee -a "$REPORT"
            test "$REF_HASH" = "$ACTUAL_HASH"
          done

          echo "FIDELITY_CHECK=PASS" | tee -a "$REPORT"

      - name: Assemble deterministic delivery MP4
        shell: bash
        env:
          FPS: ${{ needs.build-master.outputs.fps }}
          VIDEO_CODEC: ${{ needs.build-master.outputs.video_codec }}
          VIDEO_PRESET: ${{ needs.build-master.outputs.video_preset }}
          VIDEO_CRF: ${{ needs.build-master.outputs.video_crf }}
          VIDEO_PIX_FMT: ${{ needs.build-master.outputs.video_pix_fmt }}
        run: |
          mkdir -p out
          ffmpeg -y             -framerate "$FPS"             -start_number 1             -i "$RUNNER_TEMP/frames/%04d.png"             -c:v "$VIDEO_CODEC"             -preset "$VIDEO_PRESET"             -crf "$VIDEO_CRF"             -pix_fmt "$VIDEO_PIX_FMT"             -movflags +faststart             -an             -metadata creation_time=1970-01-01T00:00:00Z             out/neon-core-demo-verified-parallel.mp4

          test -s out/neon-core-demo-verified-parallel.mp4
          ffprobe -v error             -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames             -show_entries format=duration,size             -of json             out/neon-core-demo-verified-parallel.mp4 > out/video-probe.json

          cp "$RUNNER_TEMP/fidelity-report.txt" out/fidelity-report.txt
          cp "$RUNNER_TEMP/master/master-manifest.json" out/master-manifest.json
          cp "$RUNNER_TEMP/master/master-blend.sha256" out/master-blend.sha256
          cp "$RUNNER_TEMP/master/render-environment.txt" out/render-environment.txt
          cat "$RUNNER_TEMP"/frames/block-*.txt > out/block-timings.txt

      - name: Restore rclone config
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          test -n "$RCLONE_CONFIG_B64"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"

      - name: Install pinned rclone
        shell: bash
        run: |
          RCLONE_VERSION="1.75.1"
          ARCHIVE="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_VERSION}/${ARCHIVE}"
          unzip -q "$ARCHIVE"
          sudo install -m 0755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Upload verified delivery to Drive
        shell: bash
        run: |
          rclone --config "$RUNNER_TEMP/rclone.conf" mkdir "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders"
          rclone --config "$RUNNER_TEMP/rclone.conf" copy             out             "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders"             --transfers 4 --checkers 8

      - name: Upload verified delivery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-core-verified-parallel-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup credential
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone.conf"
