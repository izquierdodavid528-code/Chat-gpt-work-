name: Blender Neon Core Verified Recovery
# recovery-version: 3

on:
  push:
    paths:
      - ".github/workflows/blender-neon-core-verified-recovery.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: "37033676294"
  DRIVE_BASE: Remotion Projects
  DRIVE_PROJECT: 03 - Blender Neon Core Demo

jobs:
  verify-assemble-deliver:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download immutable master
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: neon-core-master-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/master
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download all frame blocks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: neon-core-frames-*-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/frames
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg imagemagick >/dev/null

      - name: Verify source frames
        shell: bash
        run: |
          COUNT="$(find "$RUNNER_TEMP/frames" -maxdepth 1 -name '*.png' | wc -l)"
          echo "frame_count=$COUNT"
          test "$COUNT" -eq 120
          for FRAME in $(seq 1 120); do
            NAME="$(printf '%04d.png' "$FRAME")"
            test -s "$RUNNER_TEMP/frames/$NAME"
          done

      - name: Strict fidelity gate
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/fidelity-report.txt"
          : > "$REPORT"
          for FRAME in 1 60 120; do
            NAME="$(printf '%04d.png' "$FRAME")"
            bash scripts/blender/verify-fidelity.sh \
              "$RUNNER_TEMP/master/reference/$NAME" \
              "$RUNNER_TEMP/frames/$NAME" \
              "$FRAME" \
              "$REPORT"
          done
          echo "FIDELITY_CHECK=PASS" | tee -a "$REPORT"
          cat "$REPORT"

      - name: Assemble verified MP4
        shell: bash
        run: |
          mkdir -p out
          ffmpeg -y \
            -framerate 24 \
            -start_number 1 \
            -i "$RUNNER_TEMP/frames/%04d.png" \
            -c:v libx264 \
            -preset medium \
            -crf 16 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            -an \
            -metadata creation_time=1970-01-01T00:00:00Z \
            out/neon-core-demo-verified-parallel.mp4
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
            -show_entries format=duration,size \
            -of json \
            out/neon-core-demo-verified-parallel.mp4 > out/video-probe.json
          cp "$RUNNER_TEMP/fidelity-report.txt" out/fidelity-report.txt
          cp "$RUNNER_TEMP/master/master-manifest.json" out/master-manifest.json
          cp "$RUNNER_TEMP/master/master-blend.sha256" out/master-blend.sha256
          cp "$RUNNER_TEMP/master/render-environment.txt" out/render-environment.txt
          cat "$RUNNER_TEMP"/frames/block-*.txt > out/block-timings.txt

      - name: Restore rclone config
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          test -n "$RCLONE_CONFIG_B64"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"

      - name: Install pinned rclone
        shell: bash
        run: |
          RCLONE_VERSION="1.75.1"
          ARCHIVE="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_VERSION}/${ARCHIVE}"
          unzip -q "$ARCHIVE"
          sudo install -m 0755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Upload verified delivery to Drive
        shell: bash
        run: |
          rclone --config "$RUNNER_TEMP/rclone.conf" copy \
            out \
            "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders" \
            --transfers 4 --checkers 8

      - name: Upload verified delivery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-core-verified-recovery-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup credential
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone.conf"
