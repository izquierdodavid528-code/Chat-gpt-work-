name: Blender Workspace Self-Test

on:
  push:
    paths:
      - ".github/workflows/blender-smart-render.yml"
      - ".github/workflows/blender-workspace-selftest.yml"
      - "scripts/blender/render-plan.py"
      - "scripts/blender/master-audit.py"
      - "scripts/blender/verify-master-contract.py"
      - "scripts/blender/verify-delivery.py"
      - "scripts/blender/verify_fidelity.py"
      - "scripts/blender/verify-fidelity.sh"
      - "scripts/blender/install-pinned.sh"
      - "projects/_template-blender/**"
      - "projects/blender-neon-core-demo/project.config.json"
      - "projects/haaland-goal-cinematic-test/project.config.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Python, shell and JSON syntax
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/blender/render-plan.py \
            scripts/blender/verify-master-contract.py \
            scripts/blender/verify-delivery.py \
            scripts/blender/verify_fidelity.py
          bash -n scripts/blender/verify-fidelity.sh
          bash -n scripts/blender/install-pinned.sh
          python3 -m json.tool projects/_template-blender/project.config.json >/dev/null

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          ACTIONLINT_VERSION="1.7.12"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_"$ACTIONLINT_VERSION"_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            .github/workflows/blender-smart-render.yml \
            .github/workflows/blender-workspace-selftest.yml

      - name: Validate render planner contracts
        shell: bash
        run: |
          : > "$RUNNER_TEMP/template-output.txt"
          python3 scripts/blender/render-plan.py \
            projects/_template-blender \
            "$RUNNER_TEMP/template-output.txt" \
            "$RUNNER_TEMP/template-plan.json" \
            auto "" 0
          grep -q '"render_mode": "sequential"' "$RUNNER_TEMP/template-plan.json"
          grep -q '"blender_version": "4.5.14"' "$RUNNER_TEMP/template-plan.json"

          if python3 scripts/blender/render-plan.py \
            projects/_template-blender \
            "$RUNNER_TEMP/should-fail.txt" \
            "$RUNNER_TEMP/should-fail.json" \
            parallel "" 0; then
            echo "ERROR: unsafe template unexpectedly accepted forced parallel mode"
            exit 1
          fi

          : > "$RUNNER_TEMP/neon-output.txt"
          python3 scripts/blender/render-plan.py \
            projects/blender-neon-core-demo \
            "$RUNNER_TEMP/neon-output.txt" \
            "$RUNNER_TEMP/neon-plan.json" \
            auto "" 3
          grep -q '"render_mode": "verified_parallel"' "$RUNNER_TEMP/neon-plan.json"
          grep -q '"validation_only": true' "$RUNNER_TEMP/neon-plan.json"
          grep -q '"frame_count": 3' "$RUNNER_TEMP/neon-plan.json"
          grep -q '"config_frame_count": 120' "$RUNNER_TEMP/neon-plan.json"

          : > "$RUNNER_TEMP/haaland-output.txt"
          python3 scripts/blender/render-plan.py \
            projects/haaland-goal-cinematic-test \
            "$RUNNER_TEMP/haaland-output.txt" \
            "$RUNNER_TEMP/haaland-plan.json" \
            auto "" 0
          grep -q '"render_mode": "verified_parallel"' "$RUNNER_TEMP/haaland-plan.json"

      - name: Cache exact Blender
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/chatgpt-work/blender/4.5.14
          key: blender-4.5.14-linux-x64

      - name: Install exact Blender
        run: bash scripts/blender/install-pinned.sh 4.5.14

      - name: Build template master
        env:
          BLENDER_BUILD_ONLY: "1"
          BLENDER_SKIP_POSTER: "1"
        run: |
          rm -rf projects/_template-blender/out
          mkdir -p projects/_template-blender/out
          blender -b --python projects/_template-blender/scene.py
          test -s projects/_template-blender/out/scene.blend

      - name: Audit template master
        env:
          BLENDER_SIMULATION_POLICY: "unknown"
          BLENDER_SIMULATION_CACHE_DIR: ""
          BLENDER_PACK_RESOURCES: "true"
          BLENDER_PROJECT_ROOT: "projects/_template-blender"
        run: |
          blender -b projects/_template-blender/out/scene.blend \
            --python scripts/blender/master-audit.py \
            -- projects/_template-blender/out/master-manifest.json
          sha256sum projects/_template-blender/out/scene.blend > projects/_template-blender/out/master-blend.sha256
          test -s projects/_template-blender/out/master-manifest.json

      - name: Verify master contract
        run: |
          python3 scripts/blender/verify-master-contract.py \
            "$RUNNER_TEMP/template-plan.json" \
            projects/_template-blender/out/master-manifest.json \
            projects/_template-blender/out/master-blend.sha256 \
            "$RUNNER_TEMP/master-contract-report.json"

      - name: Render one PNG and validate end-to-end QA helpers
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg imagemagick >/dev/null
          mkdir -p "$RUNNER_TEMP/frames"
          blender -b projects/_template-blender/out/scene.blend \
            -o "$RUNNER_TEMP/frames/####" \
            -F PNG \
            -f 1
          test -s "$RUNNER_TEMP/frames/0001.png"
          bash scripts/blender/verify-fidelity.sh \
            "$RUNNER_TEMP/frames/0001.png" \
            "$RUNNER_TEMP/frames/0001.png" \
            1 \
            "$RUNNER_TEMP/fidelity-report.txt"
          ffmpeg -y \
            -framerate 24 \
            -start_number 1 \
            -i "$RUNNER_TEMP/frames/%04d.png" \
            -frames:v 1 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            "$RUNNER_TEMP/test.mp4" >/dev/null 2>&1
          ffprobe -v error \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,nb_frames \
            -show_entries format=duration,size \
            -of json \
            "$RUNNER_TEMP/test.mp4" > "$RUNNER_TEMP/video-probe.json"
          python3 scripts/blender/verify-delivery.py \
            "$RUNNER_TEMP/frames" 1 1 4 \
            "$RUNNER_TEMP/video-probe.json" 1080 1080 24 \
            "$RUNNER_TEMP/delivery-report.json"

      - name: Self-test summary
        run: echo "Blender workspace self-test PASS"

  integration-neon:
    needs: validate
    uses: ./.github/workflows/blender-smart-render.yml
    with:
      project_slug: blender-neon-core-demo
      mode: auto
      drive_project_dir: ""
      validation_frame_count: "3"
