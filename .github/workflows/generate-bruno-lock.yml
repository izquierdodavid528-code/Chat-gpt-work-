name: Generate Bruno package-lock

on:
  push:
    paths:
      - ".github/workflows/generate-bruno-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.20.2"

      - name: Pin npm
        run: npm install --global npm@10.8.2

      - name: Generate lockfile
        working-directory: projects/reel-bruno-onu-2026
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile
        working-directory: projects/reel-bruno-onu-2026
        run: |
          test -f package-lock.json
          node -e 'const p=require("./package-lock.json"); if(p.lockfileVersion!==3){process.exit(1)}'

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/reel-bruno-onu-2026/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "Add reproducible npm lockfile for Bruno reel"
          git push
