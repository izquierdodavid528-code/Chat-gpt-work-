name: Create Workspace Project

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Lowercase slug, e.g. memorial-reel-02"
        required: true
        type: string
      project_type:
        description: "Project type"
        required: true
        default: remotion
        type: choice
        options:
          - remotion
          - blender
      drive_project_dir:
        description: "Optional Drive folder name. Defaults to project_slug"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.20.2"

      - name: Pin npm
        run: npm install --global npm@10.8.2

      - name: Create project
        shell: bash
        run: |
          SLUG="${{ inputs.project_slug }}"
          TYPE="${{ inputs.project_type }}"
          DRIVE_DIR="${{ inputs.drive_project_dir }}"
          if [ -z "$DRIVE_DIR" ]; then
            DRIVE_DIR="$SLUG"
          fi

          case "$TYPE" in
            remotion)
              bash scripts/workspace/new-remotion-project.sh "$SLUG" "$DRIVE_DIR"
              ;;
            blender)
              bash scripts/workspace/new-blender-project.sh "$SLUG" "$DRIVE_DIR"
              ;;
            *)
              echo "::error::Unsupported project type: $TYPE"
              exit 1
              ;;
          esac

      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/
          git commit -m "Create ${{ inputs.project_type }} project: ${{ inputs.project_slug }}"
          git push
