name: Remotion Drive Render

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Project slug, e.g. che-octubre or documental-01"
        required: true
        type: string
      repo_project_dir:
        description: "Optional repo path. Default: projects/<project_slug>"
        required: false
        default: ""
        type: string
      drive_project_dir:
        description: "Optional Drive folder under Remotion Projects. Default: <project_slug>"
        required: false
        default: ""
        type: string

jobs:
  render:
    runs-on: ubuntu-24.04

    env:
      DRIVE_BASE: "Remotion Projects"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve project paths
        shell: bash
        run: |
          SLUG="${{ inputs.project_slug }}"
          REPO_DIR="${{ inputs.repo_project_dir }}"
          DRIVE_DIR="${{ inputs.drive_project_dir }}"

          if [ -z "$SLUG" ]; then
            echo "::error::project_slug is required"
            exit 1
          fi

          if [ -z "$REPO_DIR" ]; then
            REPO_DIR="projects/$SLUG"
          fi

          CONFIG="$REPO_DIR/project.config.json"

          if [ -z "$DRIVE_DIR" ] && [ -f "$CONFIG" ]; then
            DRIVE_DIR="$(node -e 'const c=require(process.argv[1]); console.log(c.driveProjectDir || "")' "$CONFIG")"
          fi

          if [ -z "$DRIVE_DIR" ]; then
            DRIVE_DIR="$SLUG"
          fi

          echo "PROJECT_SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$REPO_DIR" >> "$GITHUB_ENV"
          echo "DRIVE_PROJECT=$DRIVE_DIR" >> "$GITHUB_ENV"

          echo "Project slug: $SLUG"
          echo "Repository project: $REPO_DIR"
          echo "Drive project: $DRIVE_DIR"

      - name: Validate project structure
        shell: bash
        run: |
          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/package.json"
          echo "Project structure OK"

      - name: Restore rclone OAuth config
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        shell: bash
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "::error::Missing repository secret RCLONE_CONFIG_B64"
            exit 1
          fi

          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"

          if ! grep -q '^\[drive\]$' "$RUNNER_TEMP/rclone.conf"; then
            echo "::error::The rclone config does not contain the drive remote"
            exit 1
          fi

      - name: Install pinned rclone
        shell: bash
        run: |
          RCLONE_VERSION="1.75.1"
          ARCHIVE="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${RCLONE_VERSION}/${ARCHIVE}"
          unzip -q "$ARCHIVE"
          sudo install -m 0755 "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version
          rclone version | head -n 1 | grep -F "rclone v${RCLONE_VERSION}"

      - name: Validate Google Drive access
        shell: bash
        run: |
          rclone \
            --config "$RUNNER_TEMP/rclone.conf" \
            lsf "drive:$DRIVE_BASE" \
            --max-depth 1

      - name: Download shared assets
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/public/shared"

          if rclone \
            --config "$RUNNER_TEMP/rclone.conf" \
            lsf "drive:$DRIVE_BASE/_shared" >/dev/null 2>&1
          then
            rclone \
              --config "$RUNNER_TEMP/rclone.conf" \
              copy \
              "drive:$DRIVE_BASE/_shared" \
              "$PROJECT_DIR/public/shared" \
              --create-empty-src-dirs \
              --transfers 8 \
              --checkers 16 \
              --stats 10s
          else
            echo "No shared assets yet; continuing."
          fi

      - name: Download project assets from Drive
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/public"

          if ! rclone \
            --config "$RUNNER_TEMP/rclone.conf" \
            lsf "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets" >/dev/null 2>&1
          then
            echo "::error::Drive assets folder not found: $DRIVE_BASE/$DRIVE_PROJECT/assets"
            exit 1
          fi

          rclone \
            --config "$RUNNER_TEMP/rclone.conf" \
            copy \
            "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets" \
            "$PROJECT_DIR/public" \
            --create-empty-src-dirs \
            --transfers 8 \
            --checkers 16 \
            --stats 10s

          echo "Assets downloaded:"
          find "$PROJECT_DIR/public" -maxdepth 4 -type f -printf '%P\n' | sort

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.20.2"

      - name: Pin npm version
        shell: bash
        run: |
          npm install --global npm@10.8.2
          node --version | grep -F "v20.20.2"
          npm --version | grep -F "10.8.2"

      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json missing; using npm install. Commit a lockfile for full dependency reproducibility."
            npm install --no-audit --no-fund
          fi

      - name: Verify pinned Remotion environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if(p.dependencies.remotion!=="4.0.530"||p.dependencies["@remotion/cli"]!=="4.0.530"){process.exit(1)}'
          npx remotion --version

      - name: Validate Remotion compositions
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run compositions

      - name: Verify Remotion browser bootstrap
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Remotion composition validation already launched the pinned Headless Shell successfully."
          echo "Expected Chrome Headless Shell: 149.0.7790.0"

      - name: Record render environment
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/out"
          {
            echo "runner=ubuntu-24.04"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "rclone=$(rclone version | head -n 1)"
            echo "remotion=$(cd "$PROJECT_DIR" && npx remotion --version | tail -n 1)"
            echo "chrome_expected=149.0.7790.0"
          } > "$PROJECT_DIR/out/render-environment.txt"

      - name: Render with Remotion
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run render

      - name: Validate rendered output
        shell: bash
        run: |
          test -d "$PROJECT_DIR/out"
          test -n "$(find "$PROJECT_DIR/out" -type f -print -quit)"
          find "$PROJECT_DIR/out" -type f -printf '%P %s bytes\n'

      - name: Upload render to Google Drive
        shell: bash
        run: |
          rclone \
            --config "$RUNNER_TEMP/rclone.conf" \
            mkdir "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders"

          rclone \
            --config "$RUNNER_TEMP/rclone.conf" \
            copy \
            "$PROJECT_DIR/out" \
            "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders" \
            --transfers 4 \
            --checkers 8 \
            --stats 10s

      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remotion-${{ env.PROJECT_SLUG }}-${{ github.run_id }}
          path: ${{ env.PROJECT_DIR }}/out/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rclone.conf"
