name: Remotion Drive Render

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Project slug, e.g. che-octubre or documental-01"
        required: true
        type: string
      repo_project_dir:
        description: "Optional repo path. Default: projects/<project_slug>"
        required: false
        default: ""
        type: string
      drive_project_dir:
        description: "Optional Drive folder under Remotion Projects. Default: <project_slug>"
        required: false
        default: ""
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GDRIVE_ROOT_FOLDER_ID: "1w9D48lqBFRxA6bNrV0ZhzUuWK0_CQ-Xf"

    steps:
      - name: Resolve project paths
        shell: bash
        run: |
          SLUG="${{ inputs.project_slug }}"
          REPO_DIR="${{ inputs.repo_project_dir }}"
          DRIVE_DIR="${{ inputs.drive_project_dir }}"

          if [ -z "$SLUG" ]; then
            echo "::error::project_slug is required"
            exit 1
          fi

          if [ -z "$REPO_DIR" ]; then
            REPO_DIR="projects/$SLUG"
          fi

          if [ -z "$DRIVE_DIR" ]; then
            DRIVE_DIR="$SLUG"
          fi

          echo "PROJECT_SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$REPO_DIR" >> "$GITHUB_ENV"
          echo "DRIVE_PROJECT=$DRIVE_DIR" >> "$GITHUB_ENV"

          echo "Project slug: $SLUG"
          echo "Repository project: $REPO_DIR"
          echo "Drive project: $DRIVE_DIR"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project structure
        shell: bash
        run: |
          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/package.json"
          echo "Project structure OK"

      - name: Validate Google Drive credential
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gdrive-service-account.json"
          test -s "$RUNNER_TEMP/gdrive-service-account.json"

      - name: Install rclone
        shell: bash
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure Drive remote
        shell: bash
        run: |
          rclone config create gdrive drive             scope drive             service_account_file "$RUNNER_TEMP/gdrive-service-account.json"             root_folder_id "$GDRIVE_ROOT_FOLDER_ID"             --non-interactive
          rclone lsf gdrive: --max-depth 1

      - name: Download shared assets
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/public/shared"
          if rclone lsf "gdrive:_shared" >/dev/null 2>&1; then
            rclone copy "gdrive:_shared" "$PROJECT_DIR/public/shared"               --create-empty-src-dirs               --transfers 8               --checkers 16               --stats 10s
          else
            echo "No shared asset folder yet; continuing."
          fi

      - name: Download project assets from Drive
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/public"
          if ! rclone lsf "gdrive:$DRIVE_PROJECT/assets" >/dev/null 2>&1; then
            echo "::error::Drive project assets folder not found: $DRIVE_PROJECT/assets"
            exit 1
          fi

          rclone copy "gdrive:$DRIVE_PROJECT/assets" "$PROJECT_DIR/public"             --create-empty-src-dirs             --transfers 8             --checkers 16             --stats 10s

          echo "Assets downloaded:"
          find "$PROJECT_DIR/public" -maxdepth 4 -type f -printf '%P\n' | sort
          test -n "$(find "$PROJECT_DIR/public" -type f -print -quit)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate Remotion compositions
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run compositions

      - name: Render with Remotion
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run render

      - name: Validate rendered output
        shell: bash
        run: |
          test -d "$PROJECT_DIR/out"
          test -n "$(find "$PROJECT_DIR/out" -type f -print -quit)"
          find "$PROJECT_DIR/out" -type f -printf '%P %s bytes\n'

      - name: Upload render to Google Drive
        shell: bash
        run: |
          rclone copy "$PROJECT_DIR/out" "gdrive:$DRIVE_PROJECT/renders"             --transfers 4             --checkers 8             --stats 10s

      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: remotion-${{ env.PROJECT_SLUG }}-${{ github.run_id }}
          path: ${{ env.PROJECT_DIR }}/out/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gdrive-service-account.json"
