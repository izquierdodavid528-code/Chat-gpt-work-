name: Remotion Smart Render

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Remotion project slug under projects/"
        required: true
        type: string
      validation_frames:
        description: "Empty = full production. Example validation: 0-29"
        required: false
        default: ""
        type: string
      skip_drive:
        description: "Testing only: skip Drive asset access"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      project_slug:
        required: true
        type: string
      validation_frames:
        required: false
        default: ""
        type: string
      skip_drive:
        required: false
        default: false
        type: boolean
    secrets:
      RCLONE_CONFIG_B64:
        required: false

permissions:
  contents: read

concurrency:
  group: remotion-smart-${{ inputs.project_slug }}
  cancel-in-progress: ${{ inputs.validation_frames != '' }}

env:
  DRIVE_BASE: "Remotion Projects"
  PINNED_RCLONE_VERSION: "1.75.1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      project_slug: ${{ steps.plan.outputs.project_slug }}
      project_dir: ${{ steps.plan.outputs.project_dir }}
      composition_id: ${{ steps.plan.outputs.composition_id }}
      drive_project: ${{ steps.plan.outputs.drive_project }}
      output_file: ${{ steps.plan.outputs.output_file }}
      concurrency: ${{ steps.plan.outputs.concurrency }}
      validation_frames: ${{ steps.plan.outputs.validation_frames }}
      validation_only: ${{ steps.plan.outputs.validation_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve render plan
        id: plan
        env:
          PROJECT_SLUG: ${{ inputs.project_slug }}
          VALIDATION_FRAMES: ${{ inputs.validation_frames }}
        run: |
          set -euo pipefail
          python3 scripts/remotion/render-plan.py             "projects/$PROJECT_SLUG"             "$GITHUB_OUTPUT"             "$RUNNER_TEMP/render-plan.json"             "$VALIDATION_FRAMES"
          cat "$RUNNER_TEMP/render-plan.json"

      - name: Upload render plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remotion-render-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/render-plan.json
          retention-days: 14
          if-no-files-found: error

  render:
    needs: plan
    runs-on: ubuntu-24.04
    env:
      PROJECT_SLUG: ${{ needs.plan.outputs.project_slug }}
      PROJECT_DIR: ${{ needs.plan.outputs.project_dir }}
      COMPOSITION_ID: ${{ needs.plan.outputs.composition_id }}
      DRIVE_PROJECT: ${{ needs.plan.outputs.drive_project }}
      OUTPUT_FILE: ${{ needs.plan.outputs.output_file }}
      REMOTION_CONCURRENCY: ${{ needs.plan.outputs.concurrency }}
      VALIDATION_FRAMES: ${{ needs.plan.outputs.validation_frames }}
      VALIDATION_ONLY: ${{ needs.plan.outputs.validation_only }}
      SKIP_DRIVE: ${{ inputs.skip_drive }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Restore rclone config
        if: env.SKIP_DRIVE != 'true'
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"
          grep -q '^\[drive\]$' "$RUNNER_TEMP/rclone.conf"

      - name: Install pinned rclone
        if: env.SKIP_DRIVE != 'true'
        run: |
          set -euo pipefail
          ARCHIVE="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/${ARCHIVE}"
          unzip -q "$ARCHIVE"
          sudo install -m 0755 "rclone-v${PINNED_RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -n 1 | grep -F "rclone v${PINNED_RCLONE_VERSION}"

      - name: Download shared and project assets
        if: env.SKIP_DRIVE != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/public/shared" "$PROJECT_DIR/public"
          if rclone --config "$RUNNER_TEMP/rclone.conf" lsf "drive:$DRIVE_BASE/_shared" >/dev/null 2>&1; then
            rclone --config "$RUNNER_TEMP/rclone.conf" copy               "drive:$DRIVE_BASE/_shared"               "$PROJECT_DIR/public/shared"               --create-empty-src-dirs --transfers 8 --checkers 16
          fi
          if rclone --config "$RUNNER_TEMP/rclone.conf" lsf "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets" >/dev/null 2>&1; then
            rclone --config "$RUNNER_TEMP/rclone.conf" copy               "drive:$DRIVE_BASE/$DRIVE_PROJECT/assets"               "$PROJECT_DIR/public"               --create-empty-src-dirs --transfers 8 --checkers 16
          else
            echo "No project assets folder found; continuing for asset-free project."
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.20.2"

      - name: Pin npm
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci --no-audit --no-fund
          node --version | grep -F "v20.20.2"
          npm --version | grep -F "10.8.2"
          node -e 'const p=require("./package.json"); if(p.dependencies.remotion!=="4.0.530"||p.dependencies["@remotion/cli"]!=="4.0.530") process.exit(1)'

      - name: Validate composition
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run compositions

      - name: Render
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_FILE")"
          EXTRA=()
          if [ -n "$VALIDATION_FRAMES" ]; then
            EXTRA+=(--frames="$VALIDATION_FRAMES")
          fi
          npx remotion render             src/index.ts             "$COMPOSITION_ID"             "$OUTPUT_FILE"             --codec=h264             --pixel-format=yuv420p             --crf=18             --concurrency="$REMOTION_CONCURRENCY"             --log=info             "${EXTRA[@]}"

      - name: Verify final video
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null
          test -s "$PROJECT_DIR/$OUTPUT_FILE"
          mkdir -p "$PROJECT_DIR/out"
          ffprobe -v error             -show_streams             -show_format             -of json             "$PROJECT_DIR/$OUTPUT_FILE" > "$PROJECT_DIR/out/video-probe.json"
          DELIVERY_ARGS=()
          if [ "$VALIDATION_ONLY" = "true" ]; then
            DELIVERY_ARGS+=(--validation)
          fi
          python3 scripts/remotion/verify-delivery.py \
            "$PROJECT_DIR/project.config.json" \
            "$PROJECT_DIR/out/video-probe.json" \
            "$PROJECT_DIR/out/delivery-report.json" \
            "${DELIVERY_ARGS[@]}"
          AUDIO_ARGS=()
          if [ "$VALIDATION_ONLY" = "true" ]; then
            AUDIO_ARGS+=(--validation)
          fi
          python3 scripts/media/audio-qa.py \
            "$PROJECT_DIR/project.config.json" \
            "$PROJECT_DIR/$OUTPUT_FILE" \
            "$PROJECT_DIR/out/video-probe.json" \
            "$PROJECT_DIR/out/audio-qa-report.json" \
            "${AUDIO_ARGS[@]}"

      - name: Record environment
        run: |
          {
            echo "runner=ubuntu-24.04"
            echo "source_commit=$GITHUB_SHA"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "remotion=$(cd "$PROJECT_DIR" && npx remotion --version | tail -n 1)"
            echo "concurrency=$REMOTION_CONCURRENCY"
            echo "validation_frames=$VALIDATION_FRAMES"
          } > "$PROJECT_DIR/out/render-environment.txt"

      - name: Upload production delivery to Drive
        if: env.VALIDATION_ONLY != 'true' && env.SKIP_DRIVE != 'true'
        run: |
          set -euo pipefail
          rclone --config "$RUNNER_TEMP/rclone.conf" mkdir "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders"
          rclone --config "$RUNNER_TEMP/rclone.conf" copy             "$PROJECT_DIR/out"             "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders"             --transfers 4 --checkers 8
          rclone --config "$RUNNER_TEMP/rclone.conf" copyto             "$PROJECT_DIR/$OUTPUT_FILE"             "drive:$DRIVE_BASE/$DRIVE_PROJECT/renders/$(basename "$OUTPUT_FILE")"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remotion-delivery-${{ env.PROJECT_SLUG }}-${{ github.run_id }}
          path: |
            ${{ env.PROJECT_DIR }}/${{ env.OUTPUT_FILE }}
            ${{ env.PROJECT_DIR }}/out/video-probe.json
            ${{ env.PROJECT_DIR }}/out/delivery-report.json
            ${{ env.PROJECT_DIR }}/out/audio-qa-report.json
            ${{ env.PROJECT_DIR }}/out/render-environment.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup credential
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone.conf"
