name: Remotion Drive Render

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "GitHub directory containing the Remotion project"
        required: true
        default: "remotion-subtitulos-es"
        type: string
      drive_project:
        description: "Project folder name inside Drive/Remotion Projects"
        required: true
        default: "00 - Prueba subtitulos Marco Rubio"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GDRIVE_ROOT_FOLDER_ID: "1w9D48lqBFRxA6bNrV0ZhzUuWK0_CQ-Xf"
      PROJECT_DIR: ${{ inputs.project_dir }}
      DRIVE_PROJECT: ${{ inputs.drive_project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Google Drive credential
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gdrive-service-account.json"
          test -s "$RUNNER_TEMP/gdrive-service-account.json"

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure Drive remote
        run: |
          rclone config create gdrive drive             scope drive             service_account_file "$RUNNER_TEMP/gdrive-service-account.json"             root_folder_id "$GDRIVE_ROOT_FOLDER_ID"             --non-interactive
          rclone lsf gdrive: --max-depth 1

      - name: Download project assets from Drive
        run: |
          mkdir -p "$PROJECT_DIR/public"
          rclone copy "gdrive:$DRIVE_PROJECT/assets" "$PROJECT_DIR/public"             --create-empty-src-dirs             --transfers 8             --checkers 16             --stats 10s
          echo "Assets downloaded:"
          find "$PROJECT_DIR/public" -maxdepth 3 -type f -printf '%P\n' | sort
          test -n "$(find "$PROJECT_DIR/public" -type f -print -quit)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ inputs.project_dir }}/package.json

      - name: Install exact project dependencies
        working-directory: ${{ inputs.project_dir }}
        run: npm install --no-audit --no-fund

      - name: Validate Remotion composition
        working-directory: ${{ inputs.project_dir }}
        run: npm run compositions

      - name: Render with Remotion
        working-directory: ${{ inputs.project_dir }}
        run: npm run render

      - name: Validate rendered output
        run: |
          test -d "$PROJECT_DIR/out"
          test -n "$(find "$PROJECT_DIR/out" -type f -print -quit)"
          find "$PROJECT_DIR/out" -type f -printf '%P %s bytes\n'

      - name: Upload render to Google Drive
        run: |
          rclone copy "$PROJECT_DIR/out" "gdrive:$DRIVE_PROJECT/renders"             --transfers 4             --checkers 8             --stats 10s

      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: remotion-${{ github.run_id }}
          path: ${{ inputs.project_dir }}/out/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gdrive-service-account.json"
