name: Remotion render

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Optional direct URL for input.mp4 if it is not committed in public/"
        required: false
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion-subtitulos-es

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: remotion-subtitulos-es/package.json

      - name: Install exact Remotion dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve source video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p public
          if [ -s public/input.mp4 ]; then
            echo "Using committed public/input.mp4"
          elif [ -n "$VIDEO_URL" ]; then
            echo "Downloading source video..."
            curl -L --fail --retry 3 --retry-delay 2 "$VIDEO_URL" -o public/input.mp4
          else
            echo "::error::Missing public/input.mp4 and no video_url was provided."
            exit 1
          fi
          test -s public/input.mp4

      - name: Validate Remotion composition
        run: npm run compositions

      - name: Render with Remotion
        run: npm run render

      - name: Validate output
        run: |
          test -s out/subtitulos-es.mp4
          echo "Remotion render completed successfully."

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotion-subtitulos-es
          path: remotion-subtitulos-es/out/subtitulos-es.mp4
          if-no-files-found: error
          retention-days: 14
