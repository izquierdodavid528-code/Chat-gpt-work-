name: Remotion Workspace Self-Test

on:
  push:
    paths:
      - ".github/workflows/remotion-drive-render.yml"
      - ".github/workflows/remotion-workspace-selftest.yml"
      - ".github/workflows/studio-render-request.yml"
      - ".github/workflows/new-project.yml"
      - "scripts/remotion/**"
      - "scripts/media/**"
      - "projects/_template-remotion/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remotion-workspace-selftest
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Python and JSON
        run: |
          python3 -m py_compile scripts/remotion/render-plan.py scripts/remotion/verify-delivery.py scripts/remotion/pull-drive-imports.py scripts/remotion/pull-remote-assets.py scripts/media/audio-qa.py scripts/media/audio-master.py
          python3 -m json.tool projects/_template-remotion/project.config.json >/dev/null

      - name: Validate workflows
        run: |
          ACTIONLINT_VERSION="1.7.12"
          printf -v ACTIONLINT_ARCHIVE 'actionlint_%s_linux_amd64.tar.gz' "$ACTIONLINT_VERSION"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$ACTIONLINT_ARCHIVE"             -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"             .github/workflows/remotion-drive-render.yml             .github/workflows/remotion-workspace-selftest.yml \
            .github/workflows/studio-render-request.yml \
            .github/workflows/new-project.yml

      - name: Validate audio QA gate with synthetic compliant media
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null
          printf '%s\n' '{"render":{"requireAudio":true,"audioQa":{"enabled":true,"requireAudio":true,"expectedCodec":"aac","expectedSampleRateHz":48000,"minChannels":1,"maxChannels":2,"targetIntegratedLufs":-14.0,"integratedLufsTolerance":2.0,"maxTruePeakDbfs":-1.0,"maxDurationDeltaSeconds":0.12,"silence":{"enabled":true,"enforce":false,"noiseDb":-50.0,"minDurationSeconds":0.5}}}}' > "$RUNNER_TEMP/audio-config.json"
          ffmpeg -y \
            -f lavfi -i "color=c=black:s=320x240:r=30:d=3" \
            -f lavfi -i "sine=frequency=1000:sample_rate=48000:duration=3" \
            -filter:a "loudnorm=I=-14:TP=-1:LRA=7" \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 48000 \
            -shortest "$RUNNER_TEMP/audio-test.mp4" >/dev/null 2>&1
          ffprobe -v error -show_streams -show_format -of json \
            "$RUNNER_TEMP/audio-test.mp4" > "$RUNNER_TEMP/audio-probe.json"
          python3 scripts/media/audio-qa.py \
            "$RUNNER_TEMP/audio-config.json" \
            "$RUNNER_TEMP/audio-test.mp4" \
            "$RUNNER_TEMP/audio-probe.json" \
            "$RUNNER_TEMP/audio-qa-report.json"
          grep -q '"result": "PASS"' "$RUNNER_TEMP/audio-qa-report.json"

          # Validation renders may skip full LUFS analysis, but they must not
          # accept an effectively silent AAC stream as usable audio.
          printf '%s\n' '{"render":{"requireAudio":true,"audioQa":{"enabled":true,"requireAudio":true,"expectedCodec":"aac","expectedSampleRateHz":48000,"minChannels":1,"maxChannels":2,"maxDurationDeltaSeconds":0.12,"validationSignal":{"enabled":true,"minPeakDbfs":-45.0}}}}' > "$RUNNER_TEMP/validation-audio-config.json"
          python3 scripts/media/audio-qa.py \
            "$RUNNER_TEMP/validation-audio-config.json" \
            "$RUNNER_TEMP/audio-test.mp4" \
            "$RUNNER_TEMP/audio-probe.json" \
            "$RUNNER_TEMP/validation-audio-pass.json" \
            --validation
          grep -q '"validationSignal": "PASS"' "$RUNNER_TEMP/validation-audio-pass.json"

          ffmpeg -y \
            -f lavfi -i "color=c=black:s=320x240:r=30:d=3" \
            -f lavfi -i "anullsrc=r=48000:cl=stereo:d=3" \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 48000 \
            -shortest "$RUNNER_TEMP/silent-audio-test.mp4" >/dev/null 2>&1
          ffprobe -v error -show_streams -show_format -of json \
            "$RUNNER_TEMP/silent-audio-test.mp4" > "$RUNNER_TEMP/silent-audio-probe.json"
          if python3 scripts/media/audio-qa.py \
            "$RUNNER_TEMP/validation-audio-config.json" \
            "$RUNNER_TEMP/silent-audio-test.mp4" \
            "$RUNNER_TEMP/silent-audio-probe.json" \
            "$RUNNER_TEMP/validation-audio-fail.json" \
            --validation; then
            echo "Silent validation fixture unexpectedly passed" >&2
            exit 1
          fi
          grep -q '"validationSignal": "FAIL"' "$RUNNER_TEMP/validation-audio-fail.json"

      - name: Validate two-pass audio mastering end-to-end
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null

          printf '%s\n' '{"render":{"requireAudio":true,"audioMastering":{"enabled":true,"targetIntegratedLufs":-15.0,"targetTruePeakDbfs":-1.5,"targetLraLu":7.0,"sampleRateHz":48000,"codec":"aac","bitrateKbps":192},"audioQa":{"enabled":true,"requireAudio":true,"expectedCodec":"aac","expectedSampleRateHz":48000,"minChannels":1,"maxChannels":2,"targetIntegratedLufs":-14.0,"integratedLufsTolerance":2.0,"maxTruePeakDbfs":-1.0,"maxDurationDeltaSeconds":0.12,"silence":{"enabled":true,"enforce":false,"noiseDb":-50.0,"minDurationSeconds":0.5}}}}' > "$RUNNER_TEMP/master-config.json"

          ffmpeg -y \
            -f lavfi -i "color=c=black:s=320x240:r=30:d=4" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=4" \
            -filter:a "volume=0.08" \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 48000 \
            -shortest "$RUNNER_TEMP/master-test.mp4" >/dev/null 2>&1

          python3 scripts/media/audio-master.py \
            "$RUNNER_TEMP/master-config.json" \
            "$RUNNER_TEMP/master-test.mp4" \
            "$RUNNER_TEMP/audio-master-report.json"

          grep -q '"result": "MASTERED"' "$RUNNER_TEMP/audio-master-report.json"

          ffprobe -v error -show_streams -show_format -of json \
            "$RUNNER_TEMP/master-test.mp4" > "$RUNNER_TEMP/master-probe.json"

          python3 scripts/media/audio-qa.py \
            "$RUNNER_TEMP/master-config.json" \
            "$RUNNER_TEMP/master-test.mp4" \
            "$RUNNER_TEMP/master-probe.json" \
            "$RUNNER_TEMP/master-qa-report.json"

          grep -q '"result": "PASS"' "$RUNNER_TEMP/master-qa-report.json"
          python3 - "$RUNNER_TEMP/master-qa-report.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1], encoding="utf-8"))
          lufs=report["metrics"].get("integratedLufs")
          peak=report["metrics"].get("truePeakDbfs")
          if lufs is None or not (-16.0 <= lufs <= -12.0):
              raise SystemExit(f"Mastering loudness outside expected QA range: {lufs}")
          if peak is None or peak > -1.0:
              raise SystemExit(f"Mastering true peak outside QA limit: {peak}")
          print(f"mastering fixture PASS: {lufs} LUFS, {peak} dBFS")
          PY

      - name: Validate planner
        run: |
          : > "$RUNNER_TEMP/out.txt"
          python3 scripts/remotion/render-plan.py             projects/_template-remotion             "$RUNNER_TEMP/out.txt"             "$RUNNER_TEMP/plan.json"             "0-0"
          grep -q '"validation_only": true' "$RUNNER_TEMP/plan.json"
          grep -q '"composition_id": "TemplateVideo"' "$RUNNER_TEMP/plan.json"
          grep -q '"concurrency": "100%"' "$RUNNER_TEMP/plan.json"

  integration-template:
    needs: validate
    uses: ./.github/workflows/remotion-drive-render.yml
    with:
      project_slug: _template-remotion
      validation_frames: "0-0"
      skip_drive: true
