name: Render Remotion Reel

on:
  push:
    branches:
      - remotion-reels
    paths:
      - "remotion-reels/**"
      - ".github/workflows/render-remotion.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remotion-reels
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: remotion-reels

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: npm run render

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: reel-final
          path: remotion-reels/out/reel-final.mp4
          if-no-files-found: error
          retention-days: 7
