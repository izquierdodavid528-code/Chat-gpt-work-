name: Render Remotion Reel

on:
  push:
    branches:
      - remotion-reels
    paths:
      - "remotion-reels/**"
      - ".github/workflows/render-remotion.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: remotion-reels
    steps:
      - name: Checkout exact render branch
        uses: actions/checkout@v4
        with:
          ref: remotion-reels

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg for verification
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render exact preview source
        run: npm run render

      - name: Verify MP4, duration and audio stream
        run: |
          test -s out/reel-final.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/reel-final.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 out/reel-final.mp4 | grep -E 'aac|mp3|opus'

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: reel-final
          path: remotion-reels/out/reel-final.mp4
          if-no-files-found: error
          retention-days: 7
